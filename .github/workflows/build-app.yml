name: Build App

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build & Upload App
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Metal Toolchain
        run: |
          sudo xcodebuild -runFirstLaunch || true
          MAJOR=$(sw_vers -productVersion | cut -d. -f1)
          if [ "$MAJOR" -ge 26 ]; then
            for i in 1 2 3 4 5; do
              if sudo xcodebuild -downloadComponent MetalToolchain; then break; fi
              sleep 10
            done
          fi

      - name: Build
        run: |
          sudo DevToolsSecurity -enable
          if ! plutil_out=$(plutil -remove com.apple.security.mach-services DynamicIsland/DynamicIsland.entitlements 2>&1); then
            printf '%s' "$plutil_out" | grep -q "No value to remove" || { echo "$plutil_out"; exit 1; }
          fi
          xcodebuild build \
            -project DynamicIsland.xcodeproj \
            -scheme DynamicIsland \
            -destination "platform=macOS" \
            -derivedDataPath build/DD \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES

      - name: Package
        run: |
          APP=$(find build/DD/Build/Products -maxdepth 2 -name "Atoll.app" | head -1)
          echo "APP=$APP"
          cd "$(dirname "$APP")"
          zip -qry /tmp/Atoll-dev.zip "$(basename "$APP")"
          cp /tmp/Atoll-dev.zip "$GITHUB_WORKSPACE/Atoll-dev.zip"

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: Atoll-dev-app
          path: Atoll-dev.zip
          retention-days: 7
